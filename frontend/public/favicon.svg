<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Dark background circle -->
  <circle cx="50" cy="50" r="50" fill="#070709"/>
  <!-- Outer dim ring -->
  <circle cx="50" cy="50" r="45" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none"/>
  <!-- Red arc (speedometer sweep) -->
  <circle cx="50" cy="50" r="45" stroke="#E10600" stroke-width="3" stroke-dasharray="283" stroke-dashoffset="75" fill="none"/>
  <!-- Tick marks -->
  <line x1="50" y1="7"  x2="50" y2="18" stroke="#E10600" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="50" x2="73" y2="50" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="93" x2="50" y2="82" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="50" x2="27" y2="50" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <!-- Checkered flag pattern -->
  <rect x="40" y="38" width="8" height="8" fill="#FFFFFF"/>
  <rect x="48" y="38" width="8" height="8" fill="#E10600"/>
  <rect x="56" y="38" width="8" height="8" fill="#FFFFFF"/>
  <rect x="40" y="46" width="8" height="8" fill="#E10600"/>
  <rect x="48" y="46" width="8" height="8" fill="#FFFFFF"/>
  <rect x="56" y="46" width="8" height="8" fill="#E10600"/>
  <!-- Speed needle -->
  <polygon points="50,50 48.5,50 49.5,20 50.5,20 51.5,50" fill="#00F0FF"/>
  <!-- Center hub -->
  <circle cx="50" cy="50" r="4.5" fill="#00F0FF"/>
  <circle cx="50" cy="50" r="2" fill="#070709"/>
</svg>
